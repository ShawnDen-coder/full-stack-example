# Optional local Collector. Applications continue serving if it is stopped.
services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/collector.yml:/etc/otelcol/config.yml:ro,Z
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    restart: unless-stopped
