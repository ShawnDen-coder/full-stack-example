services:
  app:
    profiles: [application]
    build:
      context: ..
      dockerfile: container/Dockerfile
    environment:
      DATABASE_RUNTIME_URL: postgres://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/app
      DATABASE_MIGRATOR_URL: postgres://${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}:${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}@postgres:5432/app
      HOST: 0.0.0.0
      PORT: 3000
      WEB_ORIGIN: http://localhost:3000
      WEB_ASSETS_DIR: ./public
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      LOG_FILE: /app/logs/api.jsonl
      LOG_STREAM_ENABLED: "false"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: 10000
    ports:
      - "3000:3000"
    volumes:
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector-health:
        condition: service_completed_successfully
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.121.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  otel-collector-health:
    profiles: [application]
    image: curlimages/curl:8.12.1
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "30"
      - --retry-connrefused
      - --retry-delay
      - "2"
      - http://otel-collector:13133/
    depends_on:
      - otel-collector
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app-logs:
  postgres-data:
