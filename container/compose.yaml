services:
  app:
    profiles: [application]
    image: full-stack-example:local
    build:
      context: ..
      dockerfile: container/Dockerfile
    environment:
      DATABASE_RUNTIME_URL: postgres://app_runtime:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/app
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      HOST: 0.0.0.0
      PORT: 3000
      WEB_ORIGIN: http://localhost:3000
      WEB_ASSETS_DIR: ./public
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: http://localhost:3000
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      LOG_FILE: /app/logs/api.jsonl
      LOG_STREAM_ENABLED: "false"
      JOBS_ENABLED: "true"
      BULL_BOARD_ENABLED: "true"
      BULL_BOARD_BASE_PATH: /admin/queues
      BULL_BOARD_CSRF_SECRET: ${BULL_BOARD_CSRF_SECRET:?BULL_BOARD_CSRF_SECRET is required}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: 10000
    ports:
      - "3000:3000"
    volumes:
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      admin-provision:
        condition: service_completed_successfully
      otel-collector-health:
        condition: service_healthy
    restart: unless-stopped

  jobs-worker:
    profiles: [application]
    image: full-stack-example:local
    command: ["node", "dist/entrypoints/jobs-worker.js"]
    environment:
      DATABASE_RUNTIME_URL: postgres://app_runtime:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/app
      JOBS_POOL_MAX: ${JOBS_POOL_MAX:-10}
      JOBS_WORKER_CONCURRENCY: ${JOBS_WORKER_CONCURRENCY:-5}
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_PRETTY: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      admin-provision:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

  migrate:
    profiles: [application]
    image: full-stack-example:local
    command: ["node", "dist/entrypoints/migrate.js"]
    environment:
      DATABASE_MIGRATOR_URL: postgres://app_migrator:${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  admin-provision:
    profiles: [application]
    image: full-stack-example:local
    command: ["node", "dist/entrypoints/admin-provision.js"]
    environment:
      DATABASE_RUNTIME_URL: postgres://app_runtime:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/app
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL is required}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:?PLATFORM_ADMIN_NAME is required}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector:0.121.0
    command: ["--config=env:OTELCOL_CONFIG"]
    environment:
      OTELCOL_CONFIG: |
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
        processors:
          memory_limiter:
            check_interval: 1s
            limit_mib: 128
          batch:
        exporters:
          debug:
            verbosity: basic
        service:
          extensions: [health_check]
          pipelines:
            traces:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [debug]
            metrics:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [debug]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

  otel-collector-health:
    image: curlimages/curl:8.12.1
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://otel-collector:13133/"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    build:
      context: ..
      dockerfile: container/Dockerfile.postgres
    image: full-stack-example-postgres:local
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app-logs:
  postgres-data:
