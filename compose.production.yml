# TLS terminates at an external reverse proxy forwarding to 127.0.0.1:8080.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: ${COMPOSE_PROJECT_NAME:-starter}-server
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set URL-encoded DATABASE_URL for postgres:5432/app}
    command: ["node", "dist/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  server:
    image: ${COMPOSE_PROJECT_NAME:-starter}-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_APP_URL:?Set HTTPS PUBLIC_APP_URL}
      CORS_ORIGIN: ${PUBLIC_APP_URL:?Set HTTPS PUBLIC_APP_URL}
      SERVER_SHUTDOWN_TIMEOUT_MS: 30000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 40s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ${PUBLIC_APP_URL:?Set HTTPS PUBLIC_APP_URL}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
