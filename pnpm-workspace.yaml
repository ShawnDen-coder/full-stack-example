packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  msgpackr-extract: false
catalog:
  zod: ^4.5.4
  typescript: ^6.0.3
  varlock: 1.18.0
  "@orpc/server": ^1.15.6
  "@orpc/openapi": ^1.15.6
  "@orpc/zod": ^1.15.6
  better-auth: 1.7.7
  next-themes: ^0.4.6
  sonner: ^2.0.8
  "@orpc/client": ^1.15.6
  tailwindcss: ^4.3.3
  drizzle-orm: 1.0.0-rc.4
  "@types/pg": ^8.23.1

# Deploy isolated production dependencies without copying the workspace.
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
  - check-types
