# One application release for the whole workspace; packages are not released separately.
# Tags use bare SemVer, for example 0.1.0.
branch_whitelist = ["master"]
ignore_merge_commits = true

pre_bump_hooks = [
  "pnpm check:commits",
  "pnpm exec biome check .",
  "pnpm check:boundaries",
  "pnpm test",
  "pnpm check-types",
  "pnpm build",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "ShawnDen-coder"
repository = "full-stack-example"
