name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      DATABASE_RUNTIME_URL: postgres://app_runtime:runtime@localhost:5432/app
      DATABASE_MIGRATOR_URL: postgres://app_migrator:migrator@localhost:5432/app
      BETTER_AUTH_SECRET: test-secret-that-is-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test
      OTEL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create runtime and migrator database roles
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE PASSWORD 'runtime'"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE app_migrator LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE PASSWORD 'migrator'"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT CONNECT, CREATE ON DATABASE app TO app_migrator"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO app_migrator"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE app TO app_runtime"
      - name: Run migrations with the migrator role
        run: |
          pnpm --filter @full-stack-example/api migrate:dev
          pnpm --filter @full-stack-example/api migrate:dev
      - name: Provision platform administrator
        env:
          PLATFORM_ADMIN_EMAIL: admin@example.com
          PLATFORM_ADMIN_NAME: Platform Admin
          PLATFORM_ADMIN_PASSWORD: TestAdmin123!
        run: |
          pnpm --filter @full-stack-example/api admin:provision:dev
          pnpm --filter @full-stack-example/api admin:provision:dev
      - run: just lint-check
      - run: just typecheck
      - run: just test
      - run: just db-test-integration
      - run: just auth-test-integration
      - run: just jobs-test-integration
      - run: just build
      - run: pnpm docs:build
      - name: Build production container
        run: docker build --file container/Dockerfile --tag full-stack-example:ci .
