name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check Conventional Commits
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres:18
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: full_stack_example_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d full_stack_example_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: docker.io/library/redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:integration-only@127.0.0.1:5432/full_stack_example_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm node --version
      - run: pnpm env:init
      - run: pnpm exec biome check .
      - run: pnpm check:boundaries
      - run: pnpm test
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            apps/web/playwright-report
            apps/web/test-results
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_APP_URL: https://full-stack-example.test
      BETTER_AUTH_SECRET: compose-smoke-only-secret-at-least-32-characters
      POSTGRES_PASSWORD: compose-smoke-only
      MIGRATION_DATABASE_URL: postgresql://postgres:compose-smoke-only@postgres:5432/app
      DATABASE_URL: postgresql://app_server:compose-server-only@postgres:5432/app
      WORKER_DATABASE_URL: postgresql://app_worker:compose-worker-only@postgres:5432/app
      COMPOSE_PROJECT_NAME: full-stack-example-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Podman and Compose provider
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          systemctl --user start podman.socket
          for provider in /usr/libexec/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose; do
            if [ -x "$provider" ]; then
              echo "PODMAN_COMPOSE_PROVIDER=$provider" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Compose v2 provider not found" >&2
          exit 1
      - run: podman compose version
      - run: podman compose -f container/compose.production.yml build
      - run: podman compose -f container/compose.production.yml up -d --wait
      - run: node scripts/smoke-production.mjs
      - if: failure()
        run: podman compose -f container/compose.production.yml logs --tail 100
      - if: always()
        run: podman compose -f container/compose.production.yml down -v
